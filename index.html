<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Simulasi TKA IT/PPLG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="latar">
        <div class="bentuk lingkaran-1"></div>
        <div class="bentuk lingkaran-2"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-kotak">
            <div class="login-ikon">
                <i class="fas fa-code"></i>
            </div>
            <h1>Selamat Datang</h1>
            <p class="login-desc">Simulasi TKA — Bidang IT & PPLG</p>
            
            <form id="form-login">
                <div class="form-grup">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" placeholder="Masukkan username bebas" required>
                </div>
                <div class="form-grup">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" placeholder="Masukkan password bebas" required>
                </div>
                <p class="catatan">
                    <i class="fas fa-info-circle"></i>
                    Username & password boleh diisi apa saja
                </p>
                <button type="submit" class="btn btn-primary btn-penuh">
                    <i class="fas fa-sign-in-alt"></i> Masuk ke Ujian
                </button>
            </form>
        </div>
    </div>

    <script>
        const formLogin = document.getElementById('form-login');
        formLogin.addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            if (user) {
                localStorage.setItem('namaPengguna', user);
                window.location.href = 'ujian.html';
            }
        });
    </script>
</body>
</html>
