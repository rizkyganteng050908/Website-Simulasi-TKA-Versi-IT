<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Simulasi TKA IT/PPLG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-kotak">
            <h1>🔐 Masuk</h1>
            <p class="login-desc">Simulasi TKA — Bidang IT & PPLG</p>
            
            <form id="form-login">
                <div class="form-grup">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Isi username bebas" required>
                </div>
                <div class="form-grup">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Isi password bebas" required>
                </div>
                <p class="catatan">💡 Username & password boleh isi apa saja</p>
                <button type="submit" class="btn btn-primary btn-penuh">Masuk ke Ujian</button>
            </form>
        </div>
    </div>

    <script>
        const formLogin = document.getElementById('form-login');
        formLogin.addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            if (user) {
                localStorage.setItem('namaPengguna', user);
                window.location.href = 'ujian.html';
            }
        });
    </script>
</body>
</html>
